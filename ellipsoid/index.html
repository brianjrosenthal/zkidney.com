<script language=Javascript>


function radio_val(items,defaultVal)
{
var val;
for(var i=0;i < items.length;i++)
    {
if (items[i].checked) return items[i].value;
return defaultVal;
     }
}

var form;

function calculate(form,la,lb,lc,ra,rb,rc){

form = document.getElementById('elli_form');
var la  = document.getElementById('la').value;
var lb  = document.getElementById('lb').value;
var lc  = document.getElementById('lc').value;
var ra = document.getElementById('ra').value;
var rb = document.getElementById('rb').value;
var rc = document.getElementById('rc').value;

var ellipsoid = eval(3.14159*4)
elli=ellipsoid/24
var lelli=la*lb*lc;
var relli=ra*rb*rc;
lelli=lelli*elli;
relli=relli*elli;
lelli=Math.round(lelli*10)/10;
relli=Math.round(relli*10)/10;


document.getElementById("lelli_report").innerHTML ='<b>  '+ lelli+ 'cc</b>';
document.getElementById("relli_report").innerHTML ='<b>  '+ relli+ 'cc</b>';

}
</script>
