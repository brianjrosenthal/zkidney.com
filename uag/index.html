<h2>URINE ANION GAP</h2>
<h5><span>by Brian Rosenthal and Stephen Fadem</span></h5>
</template>
<template data-zk="after">
<p>The urine anion gap measures positive and negative ions. Since urine ammonia is not measured, it is the gap anion. Healthy kidneys can excrete ammonia and trap it as ammonium to rid the body of excess acid (H+). In renal tubular acidosis or in any condition where ammonia is not secreted and trapped, the gap will be less.&nbsp;</p>

<p>The UAG is not valid if the urine sodium is &lt; 20 mEq/L or in cases of volume depletion, low chloride excretion.</p>

<p>References</p>

<p>Hilton,JG, et al. The urine anion gap: the critical clue to resolve a diagnostic dilemma in a patient with ketoacidosis</p>

<p>Diabetes Care, 7:486-490,1984.</p>
