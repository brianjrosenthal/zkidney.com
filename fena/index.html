 <script language=Javascript> 

var form;

function calculate(form,una,ucr,na,cr)
  {

form = document.getElementById('fena');
var na  = document.getElementById('na').value;
var cr  = document.getElementById('cr').value;
var una  = document.getElementById('una').value;
var ucr = document.getElementById('ucr').value;
var fena = una/ucr
var temp = na/cr
fena = fena/temp
fena = fena*100
fena = Math.round(fena*100)/100

document.getElementById("fena_report").innerHTML ='<b>  '+ fena+ '% </b>';
}

</script>
