<script language=JavaScript>
  
  
function radio_val(items,defaultVal) {
        
        for( var i = 0; i < items.length; i++) {
              
                if (items[i].checked) return items[i].value;
      }
           
          return defaultVal;
    }

 function parse(s) {
      if (s=""){
     return 0;
               }
     else if (s>=0) {return parseFloat(s);
               }
}

var form
function calculate(form,criteria_p,creatinine_p,uv_p) {
form = document.getElementById('aki');

var creatinine_p=form.creatinine_p.value;
var uv_p=form.uv_p.value;
var g
var h
var criteria_p = (radio_val(form.criteria_p,1) > 0); // 
if ( criteria_p >0) {
document.getElementById('creatinine_p').style.display="none";
document.getElementById('uv_p').style.display="inline";
document.getElementById('criteria0_report').style.display="none";
document.getElementById('criteria1_report').style.display="inline";
}
else {
document.getElementById('creatinine_p').style.display="inline";
document.getElementById('uv_p').style.display="none";
document.getElementById('criteria1_report').style.display="none";
document.getElementById('criteria0_report').style.display="inline";
}



if (uv_p==0) {
h="Select Output"
}
else if (uv_p==1) {
h="Stage 1"
}
else if (uv_p==2) {
h="Stage 2"
}
else if (uv_p==3){
h="Stage 3"
}
if (creatinine_p==0) {
g="Select Creatinine"
}
else if (creatinine_p==1) {
g="Stage 1"
}
else if (creatinine_p==2) {
g="Stage 2"
}
else if (creatinine_p==3) {
g="Stage 3"
}



document.getElementById('criteria0_report').innerHTML=g;
document.getElementById('criteria1_report').innerHTML=h;

};
</script>
